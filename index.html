<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的学习专注台</title>

  <style>
    body {
      margin: 0;
      background: #a84e48;
      color: #fff9f3;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      text-align: center;
    }

    main {
      max-width: 560px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
    }

    .timer {
      margin-top: 30px;
      padding: 35px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }

    #time {
      margin: 20px 0;
      font-size: clamp(64px, 18vw, 100px);
      font-weight: bold;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      background: #fff9f3;
      color: #a84e48;
      font-size: 20px;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      opacity: 0.75;
      font-size: 14px;
    }
  #taskForm {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}

#taskInput {
  flex: 1 1 200px;
  min-width: 0;
  padding: 14px 16px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.12);
  color: inherit;
  font: inherit;
}

#taskInput::placeholder {
  color: inherit;
  opacity: 0.65;
}

#taskInput:focus {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}

#taskForm button {
  margin: 0;
  padding: 14px 20px;
  font-size: 16px;
  border-radius: 12px;
}

#taskList {
  list-style: none;
  padding: 0;
  margin: 20px 0;
  text-align: left;
}

#taskList li {
  margin-top: 10px;
  padding: 16px 20px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.12);
  overflow-wrap: anywhere;
}
  </style>
</head>

<body>
  <main>
    <h1>我的学习专注台</h1>
    <p>一次只做一件事</p>

    <section class="timer">
      <div>
  <button type="button" id="focusMode">专注 20 分钟</button>
  <button type="button" id="breakMode">休息 5 分钟</button>
</div>
      <div id="time">20:00</div>
      <button type="button" id="start">开始专注</button>
      <button type="button" id="reset">重置</button>
    </section>
<p>
  <label for="themeColor">选择背景颜色：</label>
  <input type="color" id="themeColor" value="#a84e48">
</p>
    <p class="note">每天进步一点点</p>
    <section>
  <h2>今天想学什么？</h2>

  <form id="taskForm">
    <input
      type="text"
      id="taskInput"
      placeholder="例如：学习 n8n 查询工具"
      maxlength="100"
      required
    >
    <button type="submit">添加任务</button>
  </form>

  <ul id="taskList"></ul>
</section>
  </main>
<script>
  const timeDisplay = document.getElementById("time");
  const startButton = document.getElementById("start");
  const resetButton = document.getElementById("reset");
  const focusButton = document.getElementById("focusMode");
  const breakButton = document.getElementById("breakMode");
const themeColor = document.getElementById("themeColor");

try {
  const savedColor = localStorage.getItem("studyFocusColor");
  if (savedColor) {
    themeColor.value = savedColor;
    document.body.style.backgroundColor = themeColor.value;
  }
} catch (error) {}

themeColor.addEventListener("input", function () {
  document.body.style.backgroundColor = themeColor.value;

  try {
    localStorage.setItem("studyFocusColor", themeColor.value);
  } catch (error) {}
});
  let currentMode = "focus";
  let durationSeconds = 20 * 60;
  let remainingSeconds = durationSeconds;
  let timerId = null;
  let endTime = 0;
    let audioContext = null;

  function prepareSound() {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().catch(function () {});
    }
  }

  function playEndSound() {
    if (!audioContext || audioContext.state !== "running") return;

    for (let i = 0; i < 3; i++) {
      const oscillator = audioContext.createOscillator();
      const volume = audioContext.createGain();
      const startTime = audioContext.currentTime + i * 0.4;

      oscillator.type = "sine";
      oscillator.frequency.value = 660;

      volume.gain.setValueAtTime(0, startTime);
      volume.gain.linearRampToValueAtTime(0.15, startTime + 0.02);
      volume.gain.exponentialRampToValueAtTime(
        0.001,
        startTime + 0.25
      );

      oscillator.connect(volume);
      volume.connect(audioContext.destination);

      oscillator.start(startTime);
      oscillator.stop(startTime + 0.3);
    }
  }

  function startLabel() {
    return currentMode === "focus" ? "开始专注" : "开始休息";
  }

  function updateDisplay() {
    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;

    timeDisplay.textContent =
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  function resetTimer() {
    stopTimer();
    remainingSeconds = durationSeconds;
    endTime = 0;
    updateDisplay();
    startButton.textContent = startLabel();
  }

  function switchMode(mode) {
    currentMode = mode;
    durationSeconds = mode === "focus" ? 20 * 60 : 5 * 60;
    resetTimer();
  }

  function updateTimer() {
    remainingSeconds = Math.max(
      0,
      Math.ceil((endTime - Date.now()) / 1000)
    );

    updateDisplay();

   
    if (remainingSeconds === 0) {
  stopTimer();
  playEndSound();
  startButton.textContent = "再来一轮";
}
  }

  startButton.addEventListener("click", function () {
        prepareSound();
    if (timerId !== null) {
      updateTimer();
      stopTimer();

      if (remainingSeconds > 0) {
        startButton.textContent =
          currentMode === "focus" ? "继续专注" : "继续休息";
      }

      return;
    }

    if (remainingSeconds === 0) {
      remainingSeconds = durationSeconds;
    }

    endTime = Date.now() + remainingSeconds * 1000;
    startButton.textContent = "暂停";
    updateDisplay();
    timerId = setInterval(updateTimer, 250);
  });

  resetButton.addEventListener("click", resetTimer);

  focusButton.addEventListener("click", function () {
    switchMode("focus");
  });

  breakButton.addEventListener("click", function () {
    switchMode("break");
  });
const taskForm = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");

let tasks = [];

try {
  const savedTasks = JSON.parse(
    localStorage.getItem("studyFocusTasks") || "[]"
  );

  if (Array.isArray(savedTasks)) {
    tasks = savedTasks.filter(function (task) {
      return task &&
        typeof task.text === "string" &&
        typeof task.completed === "boolean";
    });
  }
} catch (error) {}

function saveTasks() {
  try {
    localStorage.setItem("studyFocusTasks", JSON.stringify(tasks));
  } catch (error) {}
}

function renderTask(task) {
  const taskItem = document.createElement("li");
  const label = document.createElement("label");
  const checkbox = document.createElement("input");
  const text = document.createElement("span");

  checkbox.type = "checkbox";
  checkbox.checked = task.completed;
  text.textContent = task.text;

  label.style.display = "flex";
  label.style.alignItems = "center";
  label.style.gap = "12px";
  label.style.cursor = "pointer";

  function updateTaskStyle() {
    text.style.textDecoration = task.completed ? "line-through" : "none";
    text.style.opacity = task.completed ? "0.5" : "1";
  }

  updateTaskStyle();

  checkbox.addEventListener("change", function () {
    task.completed = checkbox.checked;
    updateTaskStyle();
    saveTasks();
  });

  label.append(checkbox, text);
  taskItem.appendChild(label);
  taskList.appendChild(taskItem);
}

tasks.forEach(renderTask);

taskForm.addEventListener("submit", function (event) {
  event.preventDefault();

  const taskText = taskInput.value.trim();
  if (!taskText) return;

  const task = { text: taskText, completed: false };
  tasks.push(task);
  renderTask(task);
  saveTasks();

  taskInput.value = "";
  taskInput.focus();
});
</script>
</body>
</html>
