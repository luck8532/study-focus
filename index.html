<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的学习专注台</title>

  <style>
    body {
      margin: 0;
      background: #a84e48;
      color: #fff9f3;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      text-align: center;
    }

    main {
      max-width: 560px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
    }

    .timer {
      margin-top: 30px;
      padding: 35px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }

    #time {
      margin: 20px 0;
      font-size: clamp(64px, 18vw, 100px);
      font-weight: bold;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      background: #fff9f3;
      color: #a84e48;
      font-size: 20px;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      opacity: 0.75;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>我的学习专注台</h1>
    <p>一次只做一件事</p>

    <section class="timer">
      <div>专注学习</div>
      <div id="time">20:00</div>
      <button type="button" id="start">开始专注</button>
    </section>

    <p class="note">每天进步一点点</p>
  </main>
</body>
</html>
