<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的学习专注台</title>

  <style>
    body {
      margin: 0;
      background: #a84e48;
      color: #fff9f3;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      text-align: center;
    }

    main {
      max-width: 560px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
    }

    .timer {
      margin-top: 30px;
      padding: 35px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }

    #time {
      margin: 20px 0;
      font-size: clamp(64px, 18vw, 100px);
      font-weight: bold;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      background: #fff9f3;
      color: #a84e48;
      font-size: 20px;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      opacity: 0.75;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>我的学习专注台</h1>
    <p>一次只做一件事</p>

    <section class="timer">
      <div>
  <button type="button" id="focusMode">专注 20 分钟</button>
  <button type="button" id="breakMode">休息 5 分钟</button>
</div>
      <div id="time">20:00</div>
      <button type="button" id="start">开始专注</button>
      <button type="button" id="reset">重置</button>
    </section>

    <p class="note">每天进步一点点</p>
  </main>
<script>
  const timeDisplay = document.getElementById("time");
  const startButton = document.getElementById("start");
  const resetButton = document.getElementById("reset");
  const focusButton = document.getElementById("focusMode");
  const breakButton = document.getElementById("breakMode");

  let currentMode = "focus";
  let durationSeconds = 20 * 60;
  let remainingSeconds = durationSeconds;
  let timerId = null;
  let endTime = 0;

  function startLabel() {
    return currentMode === "focus" ? "开始专注" : "开始休息";
  }

  function updateDisplay() {
    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;

    timeDisplay.textContent =
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  function resetTimer() {
    stopTimer();
    remainingSeconds = durationSeconds;
    endTime = 0;
    updateDisplay();
    startButton.textContent = startLabel();
  }

  function switchMode(mode) {
    currentMode = mode;
    durationSeconds = mode === "focus" ? 20 * 60 : 5 * 60;
    resetTimer();
  }

  function updateTimer() {
    remainingSeconds = Math.max(
      0,
      Math.ceil((endTime - Date.now()) / 1000)
    );

    updateDisplay();

    if (remainingSeconds === 0) {
      stopTimer();
      startButton.textContent = "再来一轮";
    }
  }

  startButton.addEventListener("click", function () {
    if (timerId !== null) {
      updateTimer();
      stopTimer();

      if (remainingSeconds > 0) {
        startButton.textContent =
          currentMode === "focus" ? "继续专注" : "继续休息";
      }

      return;
    }

    if (remainingSeconds === 0) {
      remainingSeconds = durationSeconds;
    }

    endTime = Date.now() + remainingSeconds * 1000;
    startButton.textContent = "暂停";
    updateDisplay();
    timerId = setInterval(updateTimer, 250);
  });

  resetButton.addEventListener("click", resetTimer);

  focusButton.addEventListener("click", function () {
    switchMode("focus");
  });

  breakButton.addEventListener("click", function () {
    switchMode("break");
  });
</script>
</body>
</html>
